<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please Accept My Apologies</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti for celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent scrollbars when the button dodges */
            user-select: none;
            -webkit-user-select: none;
        }
        #no-btn {
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), left 0.22s cubic-bezier(0.22, 1, 0.36, 1), top 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
        }
        #yes-btn {
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.2s ease;
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-12deg); }
            75% { transform: rotate(12deg); }
        }
        .animate-wiggle {
            animation: wiggle 0.3s ease-in-out;
        }
        .trail-dot {
            position: fixed;
            pointer-events: none;
            font-size: 1.25rem;
            z-index: 15;
            transition: transform 0.6s ease-out, opacity 0.6s ease-out;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-rose-50 via-pink-50 to-red-100 min-h-screen w-screen flex items-center justify-center p-4 relative">

    <!-- Main Card -->
    <main id="card" class="bg-white/90 backdrop-blur-md shadow-2xl shadow-rose-200/60 border border-rose-100 rounded-3xl p-8 sm:p-12 max-w-lg w-full text-center relative z-10">
        
        <!-- Exact requested message -->
        <h1 id="apology-text" class="text-2xl sm:text-3xl font-bold text-slate-800 leading-relaxed tracking-tight mb-10">
            It was all my fault, im terrible sorry, please accept my apologies 😭😭
        </h1>

        <!-- Interactive Buttons Container -->
        <div id="buttons-container" class="flex items-center justify-center gap-4 sm:gap-6 min-h-[60px]">
            <!-- YES Button -->
            <button id="yes-btn" 
                class="bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-semibold text-lg px-8 py-3.5 rounded-2xl shadow-lg shadow-rose-500/30 cursor-pointer z-20">
                Yes
            </button>

            <!-- NO Button (Dodges user interaction) -->
            <button id="no-btn" 
                class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold text-lg px-8 py-3.5 rounded-2xl shadow-sm cursor-pointer z-30">
                No
            </button>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const yesBtn = document.getElementById('yes-btn');
            const noBtn = document.getElementById('no-btn');
            const buttonsContainer = document.getElementById('buttons-container');
            
            let yesScale = 1;
            let dodgeCount = 0;
            let noScale = 1;
            const sadEmojis = ['😭', '🥺', '💔', '😢', '🏃💨', '🙈'];

            /**
             * Spawns a small floating emoji trail where the "No" button used to be
             */
            function spawnTrail(x, y) {
                const dot = document.createElement('span');
                dot.className = 'trail-dot';
                dot.textContent = sadEmojis[Math.floor(Math.random() * sadEmojis.length)];
                dot.style.left = `${x}px`;
                dot.style.top = `${y}px`;
                document.body.appendChild(dot);

                requestAnimationFrame(() => {
                    dot.style.transform = `translate(${(Math.random() - 0.5) * 60}px, -45px) scale(0.5)`;
                    dot.style.opacity = '0';
                });

                setTimeout(() => dot.remove(), 600);
            }

            /**
             * Moves the "No" button to a random safe position within the viewport,
             * shrinks/tilts it playfully, leaves an emoji trail, and grows the "Yes" button.
             */
            function dodgeButton(e) {
                if (e && e.type === 'touchstart') {
                    e.preventDefault(); // Prevent accidental click on mobile tap
                }

                dodgeCount++;

                const prevRect = noBtn.getBoundingClientRect();
                spawnTrail(prevRect.left + prevRect.width / 2, prevRect.top + prevRect.height / 2);

                // Move the No button to the body on first dodge so fixed positioning works cleanly relative to viewport
                if (noBtn.parentElement !== document.body) {
                    noBtn.style.position = 'fixed';
                    noBtn.style.left = `${prevRect.left}px`;
                    noBtn.style.top = `${prevRect.top}px`;
                    document.body.appendChild(noBtn);
                }

                // Calculate safe viewport boundaries with generous padding
                const padding = 28;
                const btnWidth = noBtn.offsetWidth;
                const btnHeight = noBtn.offsetHeight;
                
                const maxX = window.innerWidth - btnWidth - padding;
                const maxY = window.innerHeight - btnHeight - padding;

                // Generate random coordinates within safe bounds
                let randomX = Math.max(padding, Math.floor(Math.random() * maxX));
                let randomY = Math.max(padding, Math.floor(Math.random() * maxY));

                // Ensure it jumps a noticeable distance away from the cursor/previous spot
                const currentX = parseFloat(noBtn.style.left) || 0;
                const currentY = parseFloat(noBtn.style.top) || 0;
                if (Math.hypot(randomX - currentX, randomY - currentY) < 120) {
                    randomX = currentX > window.innerWidth / 2 ? padding + 20 : maxX - 20;
                    randomY = currentY > window.innerHeight / 2 ? padding + 20 : maxY - 20;
                }

                // Gradually shrink the No button slightly (down to 65%) and tilt it
                noScale = Math.max(0.65, 1 - dodgeCount * 0.035);
                const tilt = (Math.random() - 0.5) * 36;
                
                noBtn.style.left = `${randomX}px`;
                noBtn.style.top = `${randomY}px`;
                noBtn.style.transform = `scale(${noScale}) rotate(${tilt}deg)`;

                // After 10 dodges, make it semi-transparent/sneaky
                if (dodgeCount >= 10) {
                    noBtn.style.opacity = '0.65';
                }

                // Gradually grow the Yes button and add a subtle pulse glow
                if (yesScale < 1.8) {
                    yesScale += 0.12;
                    yesBtn.style.transform = `scale(${yesScale})`;
                    yesBtn.style.boxShadow = `0 12px ${15 + dodgeCount * 2}px rgba(244, 63, 94, 0.45)`;
                }
            }

            // Proximity detection: dodge before the cursor even touches the button on desktop!
            document.addEventListener('mousemove', (e) => {
                if (noBtn.style.display === 'none') return;
                const rect = noBtn.getBoundingClientRect();
                const btnCenterX = rect.left + rect.width / 2;
                const btnCenterY = rect.top + rect.height / 2;
                const distance = Math.hypot(e.clientX - btnCenterX, e.clientY - btnCenterY);

                // Trigger dodge when cursor gets within 75px of the No button
                if (distance < 75) {
                    dodgeButton(e);
                }
            });

            // Trigger dodge on hover, click attempt, and touch (mobile)
            noBtn.addEventListener('mouseenter', dodgeButton);
            noBtn.addEventListener('touchstart', dodgeButton, { passive: false });
            noBtn.addEventListener('click', dodgeButton);

            // Handle "Yes" acceptance
            yesBtn.addEventListener('click', () => {
                // Hide the dodging No button
                noBtn.style.display = 'none';
                
                // Reset Yes button scale and show accepted state visually with a heart
                yesBtn.style.transform = 'scale(1)';
                yesBtn.innerHTML = '❤️';
                yesBtn.classList.remove('bg-rose-500', 'hover:bg-rose-600');
                yesBtn.classList.add('bg-emerald-500', 'shadow-emerald-500/30', 'cursor-default');

                // Trigger celebratory confetti burst
                try {
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: ['#f43f5e', '#ec4899', '#fb7185', '#fda4af']
                    });
                } catch (err) {
                    // Fallback gracefully if confetti fails to load
                }
            });

            // Keep No button inside viewport if window is resized
            window.addEventListener('resize', () => {
                if (noBtn.style.position === 'fixed') {
                    const padding = 20;
                    const maxX = window.innerWidth - noBtn.offsetWidth - padding;
                    const maxY = window.innerHeight - noBtn.offsetHeight - padding;
                    const currentX = parseFloat(noBtn.style.left);
                    const currentY = parseFloat(noBtn.style.top);

                    if (currentX > maxX) noBtn.style.left = `${Math.max(padding, maxX)}px`;
                    if (currentY > maxY) noBtn.style.top = `${Math.max(padding, maxY)}px`;
                }
            });
        });
    </script>
</body>
</html>
